<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css"
    />
    <title>🌎 Country Explorer 🌎</title>
  </head>
  <body>
    <header>
      <h1>Country Explorer</h1>
      <p>Search any country to see cool statistics!</p>
    </header>

    <main>
      <search>
        <form id="country-search-form">
          <input
            type="search"
            id="country-search-bar"
            required
            placeholder="Travel the world!"
          />
          <button type="submit" id="country-search-submit">Go!</button>
        </form>
      </search>

      <div id="result-grid"></div>
    </main>

    <div class="modal-overlay">
      <div class="result-modal-box">
        <header>
          <h2 class="result-modal-box-name">Country Name</h2>
        </header>
        <article>
          <span class="result-modal-box-flag fi fi-un"></span>
          <ul>
            <li class="result-modal-box-capital">capital</li>
            <li class="result-modal-box-population">Population</li>
            <li class="result-modal-box-currency">currency</li>
            <li class="result-modal-box-language">Language</li>
          </ul>
        </article>
        <footer>
          <button class="modal-close" type="button">
            <svg
              xmlns="http://w3.org"
              width="12"
              height="12"
              viewBox="0 0 12 12"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="1" y1="11" x2="11" y2="1"></line>
              <line x1="1" y1="1" x2="11" y2="11"></line>
            </svg>
          </button>
        </footer>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
